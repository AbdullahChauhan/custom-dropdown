name: animated_custom_dropdown
description: Highly customizable animated dropdown widget. Features include search on list data, network search with infinite scroll (pagination), multi-selection, configurable overlay animations, a floating label and more.
version: 4.0.0
homepage: https://github.com/AbdullahChauhan/custom-dropdown
repository: https://github.com/AbdullahChauhan/custom-dropdown
issue_tracker: https://github.com/AbdullahChauhan/custom-dropdown/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:

funding:
  - https://buymeacoffee.com/abdullahchauhan

screenshots:
  - description: "Animated open and close transitions"
    path: readme_assets/preview.gif
  - description: "Searchable dropdown with a clear button"
    path: screenshots/search_dropdown.jpg
  - description: "Decorated multi-select search dropdown"
    path: screenshots/multi_select_search.jpg
  - description: "Custom dropdown preview"
    path: screenshots/preview.png

topics:
  - ui
  - dropdown
  - spinner
  - widget
  - widgets
